name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: npm test
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const m=require('./module.json'); if(process.env.GITHUB_REF_NAME !== 'v'+m.version || !m.download.includes('/v'+m.version+'/')) process.exit(1)"
      - run: python scripts/build_release.py
      - name: Publish installable assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/module.json dist/module.zip --title "Lazy Monster Builder $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
